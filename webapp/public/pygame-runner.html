<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skolepython Pygame-spillflate</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b2623; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #214841, #0b2623 72%); }
      canvas { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; outline: 0; background: #fffdf8; image-rendering: pixelated; box-shadow: 0 18px 55px #0008; }
      canvas:focus-visible { box-shadow: 0 0 0 4px #f4c95d, 0 18px 55px #0008; }
      #loading { position: absolute; inset: 0; display: grid; place-items: center; color: #dce9e4; font-size: 14px; font-weight: 750; }
      body.is-ready #loading { display: none; }
    </style>
  </head>
  <body>
    <div id="loading">Laster Pygame lokalt i nettleseren …</div>
    <canvas id="canvas" width="800" height="500" tabindex="0" aria-label="Pygame-spillflate. Klikk her og bruk tastaturet for å styre spillet."></canvas>
    <script type="module" src="./pygame-runner.mjs"></script>
  </body>
</html>
